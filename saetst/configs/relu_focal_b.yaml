# Spec Scheme B — explained-variance shortfall focal reweighting (primary scheme).
arch: relu
expansion: 8
model_name: EleutherAI/pythia-70m-deduped
layer: 3
site: resid_post
dataset_name: NeelNanda/pile-10k
seq_len: 128
batch_size: 4096
n_steps: 30000
lr: 1.0e-3
sparsity_coef: 1.0e-3
focal_scheme: fit
focal_gamma: 1.0
focal_ema_decay: 0.99
focal_warmup_steps: 1000
focal_clip_lo: 0.1
focal_clip_hi: 10.0
seed: 0
out_dir: runs
